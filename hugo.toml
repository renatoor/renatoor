baseURL = 'https://renatorodrigues.dev/'
title = 'renato rodrigues'
theme = 'custom-theme'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    weight = 1
    [languages.en.params]
      description = 'Senior Software Engineer'
    [[languages.en.menus.main]]
      name = 'home'
      pageRef = '/'
      weight = 10
    [[languages.en.menus.main]]
      name = 'about'
      pageRef = '/about'
      weight = 20
    [[languages.en.menus.main]]
      name = 'blog'
      pageRef = '/blog'
      weight = 30

  [languages.pt-br]
    languageCode = 'pt-BR'
    languageName = 'Português'
    weight = 2
    [languages.pt-br.params]
      description = 'Engenheiro de Software Sênior'
    [[languages.pt-br.menus.main]]
      name = 'início'
      pageRef = '/'
      weight = 10
    [[languages.pt-br.menus.main]]
      name = 'sobre'
      pageRef = '/about'
      weight = 20
    [[languages.pt-br.menus.main]]
      name = 'blog'
      pageRef = '/blog'
      weight = 30

[params]
  [params.social]
    github = 'https://github.com/renatoor'
    linkedin = 'https://linkedin.com/in/renato-r'
    email = 'hello@renatorodrigues.dev'

# Tailwind CSS build config
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[markup.tableOfContents]
  startLevel = 1
  endLevel = 2

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$'], ['\[', '\]']]
    inline = [['\(', '\)']]

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
  [[module.mounts]]
    source = 'node_modules/katex/dist'
    target = 'assets/katex'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'node_modules/katex/dist/fonts'
    target = 'static/katex/fonts'

[caches]
  [caches.images]
    dir = ':cacheDir/images'