{{ define "main" }}
  <article class="space-y-8">
    <header class="space-y-4">
      <h1 class="text-3xl font-bold">{{ .Title }}</h1>
      {{- if not .Date.IsZero }}
        <time datetime="{{ .Date | time.Format "2006-01-02" }}" class="block text-sm text-neutral-500 dark:text-neutral-500">
          {{ .Date | time.Format "January 2, 2006" }}
        </time>
      {{- end }}
    </header>

    <div class="prose prose-neutral dark:prose-invert max-w-none">
      {{ .Content }}
    </div>

    {{- with .GetTerms "tags" }}
      <footer class="pt-4 border-t border-neutral-200 dark:border-neutral-800">
        <div class="flex flex-wrap gap-2">
          {{- range . }}
            <a href="{{ .RelPermalink }}" class="text-sm px-3 py-1 rounded-full bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-100 transition-colors">
              {{ .LinkTitle }}
            </a>
          {{- end }}
        </div>
      </footer>
    {{- end }}
  </article>
{{ end }}
