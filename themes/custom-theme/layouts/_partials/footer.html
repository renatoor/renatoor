<div class="w-full max-w-2xl mx-auto px-6 py-6">
  <div class="flex items-center justify-center gap-2 text-sm text-neutral-600 dark:text-neutral-400">
    {{- with site.Params.social.github }}
      <a href="{{ . }}" target="_blank" rel="noopener noreferrer" class="hover:text-neutral-900 dark:hover:text-neutral-100 transition-colors">github</a>
      <span class="text-neutral-400 dark:text-neutral-600">&middot;</span>
    {{- end }}
    {{- with site.Params.social.linkedin }}
      <a href="{{ . }}" target="_blank" rel="noopener noreferrer" class="hover:text-neutral-900 dark:hover:text-neutral-100 transition-colors">linkedin</a>
      <span class="text-neutral-400 dark:text-neutral-600">&middot;</span>
    {{- end }}
    {{- with site.Params.social.email }}
      <a href="mailto:{{ . }}" class="hover:text-neutral-900 dark:hover:text-neutral-100 transition-colors">email</a>
    {{- end }}
  </div>
</div>
