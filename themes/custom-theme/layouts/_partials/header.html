<div class="w-full max-w-2xl mx-auto px-6 py-4 flex items-center justify-between relative">
  <a href="/" class="font-mono text-base font-semibold text-neutral-900 dark:text-neutral-100 hover:text-accent-500 transition-colors tracking-tight">
    renato<span class="text-accent-500">.</span>rodrigues
  </a>
  <div class="flex items-center gap-1">
    {{/* Desktop navigation */}}
    <div class="hidden md:block">
      {{ partial "menu.html" (dict "menuID" "main" "page" .) }}
    </div>
    {{/* Hamburger button - mobile only */}}
    <button
      id="menu-toggle"
      onclick="toggleMenu()"
      class="theme-toggle flex items-center justify-center text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-100 transition-colors md:hidden"
      aria-label="Toggle menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >
      {{/* Hamburger icon */}}
      <svg id="menu-icon-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      {{/* Close icon */}}
      <svg id="menu-icon-close" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
    {{/* Theme toggle */}}
    <button
      onclick="toggleTheme()"
      class="theme-toggle flex items-center justify-center text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-100 transition-colors"
      aria-label="Toggle theme"
    >
      {{/* Sun icon - shown in dark mode */}}
      <svg class="w-[18px] h-[18px] hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      {{/* Moon icon - shown in light mode */}}
      <svg class="w-[18px] h-[18px] block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
    </button>
  </div>
</div>
{{/* Mobile navigation menu - overlay */}}
<div
  id="mobile-menu"
  class="hidden md:hidden absolute left-0 right-0 top-full bg-neutral-50/95 dark:bg-neutral-950/95 backdrop-blur-md border-t border-neutral-200/50 dark:border-neutral-800/50 shadow-lg z-50"
>
  {{ partial "menu.html" (dict "menuID" "main" "page" . "mobile" true) }}
</div>
