<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" class="dark">
<head>
  {{ partial "head.html" . }}
</head>
<body class="bg-white dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen flex flex-col">
  <header class="border-b border-neutral-200 dark:border-neutral-800 relative">
    {{ partial "header.html" . }}
  </header>
  <main class="flex-1 w-full max-w-2xl mx-auto px-6 pt-0 pb-4 lg:py-12">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="border-t border-neutral-200 dark:border-neutral-800">
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
